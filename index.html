<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <!-- 自分のサイト以外からの読み込みと送信を禁止する -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; object-src 'none'; base-uri 'none'">
  <title>頑張れジム通い</title>
  <meta name="theme-color" content="#F26B1D">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="頑張れジム通い">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/style.css">
  <script type="module" src="js/main.js"></script>
</head>
<body>
  <!-- 画面上部の案内 -->
  <div class="banners">
    <div class="banner" data-ref="banner-update" hidden>
      <span>新しい版があります。</span>
      <button type="button" data-ref="update-button">更新する</button>
    </div>
    <div class="banner" data-ref="banner-backup" hidden>
      <span data-ref="backup-message"></span>
      <a href="#/settings">書き出す</a>
    </div>
    <div class="banner" data-ref="banner-install" hidden>
      <span>共有ボタン →「ホーム画面に追加」で追加すると、データが消えにくくなります。</span>
      <button type="button" class="icon-button" data-ref="install-dismiss" aria-label="閉じる">×</button>
    </div>
  </div>

  <!-- 各画面（views/*.html）がここに入る -->
  <main class="view" data-ref="view"></main>

  <nav class="tabbar" aria-label="画面の切り替え">
    <a href="#/record" data-tab="record">記録</a>
    <a href="#/history" data-tab="history">履歴</a>
    <a href="#/graph" data-tab="graph">グラフ</a>
    <a href="#/settings" data-tab="settings">設定</a>
  </nav>

  <!-- S-4 記録編集シート（記録・履歴・グラフ画面で共通） -->
  <dialog class="sheet" data-ref="record-editor">
    <form class="sheet-body" data-ref="editor-form" novalidate>
      <header class="sheet-header">
        <h2>記録を修正</h2>
        <button type="button" class="icon-button" data-ref="editor-close" aria-label="閉じる">×</button>
      </header>
      <label class="field">
        <span>日時</span>
        <input type="datetime-local" data-ref="editor-datetime">
      </label>
      <label class="field">
        <span>種目</span>
        <select data-ref="editor-exercise"></select>
      </label>
      <div class="field-row" data-ref="editor-strength">
        <label class="field">
          <span>重量（kg）</span>
          <input type="number" inputmode="decimal" step="0.1" data-ref="editor-weight">
        </label>
        <label class="field">
          <span>回数</span>
          <input type="number" inputmode="numeric" step="1" data-ref="editor-reps">
        </label>
      </div>
      <div class="field-row" data-ref="editor-cardio"></div>
      <fieldset class="field">
        <legend>辛さ</legend>
        <div class="difficulty-picker" data-ref="editor-difficulty"></div>
        <p class="difficulty-hint" data-ref="editor-difficulty-hint"></p>
      </fieldset>
      <label class="field">
        <span>備考</span>
        <input type="text" data-ref="editor-note">
      </label>
      <p class="error" data-ref="editor-error" role="alert"></p>
      <div class="sheet-actions">
        <button type="button" class="danger" data-ref="editor-delete">削除</button>
        <button type="submit" class="primary">保存</button>
      </div>
    </form>
  </dialog>

  <div class="toast" data-ref="toast" role="status" hidden>
    <span data-ref="toast-message"></span>
    <button type="button" class="toast-action" data-ref="toast-action" hidden></button>
  </div>

  <!-- 複数の画面で使う部品 -->
  <template data-tpl="set-row">
    <li>
      <button type="button" class="set-row">
        <span class="set-no" data-field="no"></span>
        <span class="set-main" data-field="summary"></span>
        <span class="badge" data-field="difficulty"></span>
        <span class="set-note" data-field="note"></span>
      </button>
    </li>
  </template>

  <template data-tpl="editor-cardio-field">
    <label class="field">
      <span data-field="label"></span>
      <input type="number" inputmode="decimal">
    </label>
  </template>

  <template data-tpl="difficulty-button">
    <button type="button" class="difficulty-option" aria-pressed="false"><span data-field="label"></span></button>
  </template>
</body>
</html>
