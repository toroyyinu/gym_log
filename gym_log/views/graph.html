<!-- S-5 グラフ画面 -->
<section class="screen">
  <h1 class="screen-title">グラフ</h1>

  <p class="muted" data-ref="no-exercise" hidden>記録すると、ここにグラフが出ます。</p>

  <div data-ref="content">
    <label class="field">
      <span>種目</span>
      <select data-ref="exercise"></select>
    </label>

    <div class="segmented" role="group" aria-label="表示期間">
      <button type="button" data-period="1m" aria-pressed="false">1か月</button>
      <button type="button" data-period="3m" aria-pressed="true">3か月</button>
      <button type="button" data-period="all" aria-pressed="false">すべて</button>
    </div>

    <div class="segmented metric-tabs" role="group" aria-label="グラフの項目" data-ref="metrics" hidden></div>

    <div class="card">
      <p class="muted small"><span data-ref="caption"></span>。<span data-ref="tap-hint">点を押すと、その日の記録が出ます。</span></p>
      <svg class="chart" data-ref="chart" role="img" aria-label="推移グラフ"></svg>
      <p class="muted" data-ref="empty" hidden>この期間の記録はありません。</p>
    </div>

    <section class="card" data-ref="detail" hidden>
      <h2 data-ref="detail-date"></h2>
      <ol class="set-list" data-ref="detail-sets"></ol>
    </section>
  </div>

  <template data-tpl="metric-button">
    <button type="button" aria-pressed="false"><span data-field="label"></span></button>
  </template>
</section>
