<!-- S-7 種目編集画面 -->
<section class="screen">
  <h1 class="screen-title" data-ref="title">種目を登録</h1>
  <p class="muted" data-ref="not-found" hidden>この種目は見つかりませんでした。</p>

  <form class="card" data-ref="form" novalidate>
    <label class="field">
      <span>種目名</span>
      <input type="text" data-ref="name" placeholder="例：チェストプレス">
    </label>

    <fieldset class="field">
      <legend>種類</legend>
      <div class="check-list" data-ref="kinds"></div>
      <p class="muted small" data-ref="kind-note"></p>
    </fieldset>

    <fieldset class="field" data-ref="strength-only">
      <legend>鍛える筋肉（いくつでも選べます）</legend>
      <div data-ref="muscles"></div>
      <h3>その他の筋肉</h3>
      <div class="add-muscle">
        <input type="text" data-ref="new-muscle-name" placeholder="筋肉の名前" aria-label="追加する筋肉の名前">
        <select data-ref="new-muscle-group" aria-label="部位"></select>
        <button type="button" data-ref="add-muscle">追加</button>
      </div>
      <p class="error" data-ref="muscle-error" role="alert"></p>
      <p class="muted small">追加した筋肉は、次からほかの種目でも選べます。</p>
    </fieldset>

    <label class="field" data-ref="step-field">
      <span>重量の刻み幅（kg）：＋／−ボタン1回で変わる重さ</span>
      <input type="number" inputmode="decimal" step="0.5" data-ref="step">
    </label>

    <label class="field">
      <span>固定メモ（任意）</span>
      <input type="text" data-ref="fixed-note" placeholder="例：シート位置4">
    </label>

    <p class="error" data-ref="error" role="alert"></p>
    <button type="submit" class="primary large" data-ref="submit">保存</button>
  </form>

  <div class="button-stack" data-ref="manage" hidden>
    <button type="button" data-ref="toggle-hidden"></button>
    <button type="button" class="danger" data-ref="delete" hidden>この種目を削除</button>
    <p class="muted small" data-ref="manage-note"></p>
  </div>

  <a class="back-link" data-ref="back" href="#/settings">← 戻る</a>

  <template data-tpl="muscle-check-group">
    <div class="check-group">
      <h3 data-field="group"></h3>
      <div class="check-list" data-field="checks"></div>
    </div>
  </template>

  <template data-tpl="kind-option">
    <label class="check"><input type="radio" name="kind"> <span data-field="label"></span></label>
  </template>

  <template data-tpl="muscle-check">
    <label class="check"><input type="checkbox"> <span data-field="name"></span></label>
  </template>
</section>
